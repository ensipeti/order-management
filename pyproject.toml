[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "order-management-system"
version = "0.1.0"
description = "In-memory order books and a REST pricing API"
requires-python = ">=3.13"
dependencies = ["fastapi==0.119.0", "uvicorn==0.37.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.0", "mypy==1.18.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/order_management"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/order_management"]

[tool.pytest.ini_options]
testpaths = ["tests"]
